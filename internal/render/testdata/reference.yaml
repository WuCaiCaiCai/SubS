allow-lan: false
bind-address: '*'
dns:
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.internal'
        - localhost.ptlogin2.qq.com
        - +.stun.*
        - +.bilibili.com
        - time.*.com
        - time.*.gov
        - ntp.*.com
        - +.push.apple.com
        - +.msftconnecttest.com
        - +.msftncsi.com
    fake-ip-filter-v6: 2800:1::/48
    fake-ip-range: 198.18.0.1/16
    ipv6: true
    nameserver:
        - https://doh.pub/dns-query
        - https://dns.alidns.com/dns-query
        - 119.29.29.29
        - 223.5.5.5
    proxy-server-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    respect-rules: true
external-controller: 127.0.0.1:9090
find-process-mode: "off"
geodata-loader: standard
geodata-mode: true
geosite-matcher: strand
