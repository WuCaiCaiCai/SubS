name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Verify Go code
        run: |
          go vet ./...
          go test ./...

      - name: Build Linux x64 release assets
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist/release
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o dist/release/subs ./cmd/subs
          tar -C dist/release -czf "dist/release/subs_${version}_linux_amd64.tar.gz" subs
          cp install.sh dist/release/install.sh
          cd dist/release
          sha256sum "subs_${version}_linux_amd64.tar.gz" > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/subs_*_linux_amd64.tar.gz
            dist/release/checksums.txt
            dist/release/install.sh
          generate_release_notes: true
