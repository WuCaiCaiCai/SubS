# ====================================================
# Mihomo / Clash Meta 完整主路由配置 (TProxy + Fake-IP 双栈优化版)
# ====================================================

# 基础端口与控制
port: 7890
socks-port: 7891
tproxy-port: 7892
allow-lan: true
bind-address: "*"
mode: Rule
log-level: warning
external-controller: 0.0.0.0:9090
routing-mark: 666

# ----------------------------------------------------
# █ 内核性能与连通性优化 (软路由专供)
# ----------------------------------------------------
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
find-process-mode: off

# Geo 规则加载与性能优化设置
geo-auto-update: false
geo-update-interval: 0
geodata-mode: true
geodata-loader: standard
geosite-matcher: strand

# 策略组选择状态持久化
profile:
  store-selected: true

# ----------------------------------------------------
# █ 流量嗅探
# ----------------------------------------------------
sniffer:
  enable: true
  forced-dns-mapping: true
  parse-pure-ip: true
  sniff:
    tls:
      ports: [443, 8443]
    http:
      ports: [80, 8080-8090]

# ----------------------------------------------------
# █ DNS 配置 (Fake-IP IPv4/IPv6)
# ----------------------------------------------------
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-v6: "2800:1::/48"
  respect-rules: true

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114

  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.internal"
    - localhost.ptlogin2.qq.com
    - "+.stun.*"
    - "+.bilibili.com"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"

# ----------------------------------------------------
# █ 代理节点定义
# ----------------------------------------------------
proxies: []

proxy-providers: {}

# ----------------------------------------------------
# █ 策略组定义 (All 置顶；Microsoft/Apple 默认 Stable；XBOX 默认 DIRECT)
# ----------------------------------------------------
proxy-groups:
  # 全局兜底选择组
  - name: All
    type: select
    include-all: true
    proxies:
      - DIRECT

  # 稳定优先：不易掉线，适合 AI 与核心账号/生态服务
  - name: Stable
    type: select
    include-all: true
    proxies:
      - DIRECT

  # 速度优先：高带宽/低延迟，适合流媒体与高频海外服务
  - name: HighSpeed
    type: select
    include-all: true
    proxies:
      - DIRECT

  # 大流量/下载优先：侧重吞吐速度
  - name: BulkDownload
    type: select
    include-all: true
    proxies:
      - DIRECT

  # Microsoft 分组：默认 Stable，可选 DIRECT
  - name: Microsoft
    type: select
    proxies:
      - Stable
      - DIRECT

  # Apple 分组：默认 Stable，可选 DIRECT
  - name: Apple
    type: select
    proxies:
      - Stable
      - DIRECT

  # XBOX 下载分组：默认 DIRECT，可选 BulkDownload
  - name: XBOX
    type: select
    proxies:
      - DIRECT
      - BulkDownload

